# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/omniflow_ai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:poova2005@}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.MySQL8Dialect}

# JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Server
server.port=8080

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:your-gemini-key}
gemini.model=gemini-2.5-flash
gemini.temperature=0.7
gemini.max-output-tokens=2000

# OpenAI Configuration (optional - service uses mock fallback when key is not set)
openai.api.key=${OPENAI_API_KEY:mock-key}
openai.model=gpt-3.5-turbo
openai.temperature=0.7
openai.max-tokens=2000

# ============================================================
# RAG Configuration - LOWER THRESHOLD FOR NOW
# ============================================================
rag.max.chunks=5
rag.similarity.threshold=0.1
rag.chunk.size=500
rag.chunk.overlap=50
