version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: omniflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-omniflow_ai}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - omniflow-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 20s
      retries: 10

  redis:
    image: redis:7.0-alpine
    container_name: omniflow-redis
    ports:
      - "6379:6379"
    networks:
      - omniflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniflow-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-omniflow_ai}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - omniflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omniflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - omniflow-network

networks:
  omniflow-network:
    driver: bridge

volumes:
  mysql-data:
